
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aerox DPI Lab</title>
<style>
body {
  background: #101010;
  color: white;
  font-family: Arial, sans-serif;
  padding: 35px;
}
button {
  padding: 12px 18px;
  margin: 5px;
  cursor: pointer;
}
pre {
  background: #1c1c1c;
  padding: 15px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
</style>
</head>
<body>
<h1>Aerox DPI Lab</h1>
<p>Hardware diagnostics — no DPI commands will be sent.</p>

<button id="connect">Connect mouse</button>
<button id="disconnect">Disconnect</button>
<pre id="output">Not connected.</pre>

<script>
let devices = [];

const output = document.getElementById("output");

document.getElementById("connect").onclick = async () => {
  try {
    devices = await navigator.hid.requestDevice({ filters: [] });

    if (!devices.length) {
      output.textContent = "No device selected.";
      return;
    }

    output.textContent = devices.map((d, i) => {
      const collections = d.collections.map(c =>
        `Usage page: ${c.usagePage}, Usage: ${c.usage}`
      ).join("\n  ");

      return `Device ${i + 1}
Name: ${d.productName}
Vendor ID: ${d.vendorId}
Product ID: ${d.productId}
Opened: ${d.opened}
Collections:
  ${collections || "No collections reported"}`;
    }).join("\n\n");
  } catch (e) {
    output.textContent = `${e.name}: ${e.message}`;
  }
};

document.getElementById("disconnect").onclick = async () => {
  devices = [];
  output.textContent = "Disconnected from this page.";
};
</script>
</body>
</html>
